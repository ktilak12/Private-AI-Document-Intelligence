version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: paidi-db
    environment:
      POSTGRES_USER: paidi_user
      POSTGRES_PASSWORD: paidi_password
      POSTGRES_DB: paidi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
